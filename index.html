<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="shared/move.js?v=1.0.2"></script>
<meta name="theme-color" content="#0b1120"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HK Dashboard">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest?v=2.0.0">
<link rel="stylesheet" href="home.css?v=2.0.2">
<title>Smart Dashboard</title>
<script>
// GitHub Pages lets Safari keep this page for up to 10 minutes, so after a
// release it could show the old version. Fetch the page fresh on open and when
// returning to the app; if its ?v= cache-busters differ, reload the new one.
(()=>{const marks=doc=>[...doc.querySelectorAll('link[href*="?v="],script[src*="?v="]')].map(e=>e.getAttribute('href')||e.getAttribute('src')).join();
 async function check(){try{const r=await fetch(location.pathname,{cache:'no-store'});if(!r.ok)return;const fresh=new DOMParser().parseFromString(await r.text(),'text/html'),theirs=marks(fresh);
  if(!theirs||theirs===marks(document))return;const key='reloaded:'+location.pathname+theirs;if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');
  location.replace(location.pathname+'?v='+encodeURIComponent(theirs.match(/\?v=([\w.-]+)/)[1]));}catch{}}
 addEventListener('DOMContentLoaded',check);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});})();
</script>
</head>
<body>
<main class="shell">
 <header class="top">
  <div><div class="eyebrow" id="today">HONG KONG</div><h1 id="title">Smart Dashboard</h1></div>
  <div class="lang" role="group" aria-label="Language"><button data-lang="en" type="button">EN</button><button data-lang="tc" type="button">中文</button></div>
 </header>
 <div id="weather" class="weather"></div>
 <nav class="tiles">
  <a class="tile bus" href="bus-eta/"><span class="icon"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="21" rx="5"/><path d="M6 15h20M10 25v3m12-3v3M11 20h1m8 0h1M10 9h12"/></svg></span><span class="name" id="busName">Bus</span></a>
  <a class="tile mtr" href="mtr-eta/"><span class="icon"><svg viewBox="0 0 32 32"><rect x="6" y="3" width="20" height="23" rx="7"/><path d="M9 14h14M11 9h10M11 26l-3 4m13-4 3 4M12 20h2m4 0h2"/></svg></span><span class="name" id="mtrName">MTR</span></a>
  <a class="tile tram" href="tram-eta/"><span class="icon"><svg viewBox="0 0 32 32"><rect x="7" y="8" width="18" height="17" rx="4"/><path d="M7 16h18M12 3h8M16 3v5M11 25l-3 4m13-4 3 4M12 20h1m6 0h1"/></svg></span><span class="name" id="tramName">Tram</span></a>
  <a class="tile ferry" href="ferry-eta/"><span class="icon"><svg viewBox="0 0 32 32"><path d="M5 19l3 6h16l3-6zM9 19v-7h14v7M13 12V7h6v5M4 29c3 0 3-1.5 6-1.5s3 1.5 6 1.5 3-1.5 6-1.5 3 1.5 6 1.5"/></svg></span><span class="name" id="ferryName">Ferry</span></a>
 </nav>
 <section class="block">
  <div class="block-head"><h2 id="nearbyTitle">Nearby</h2><button class="locate" id="locateBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="7.5"/></svg><span id="locateLabel">Locate me</span></button></div>
  <div class="list" id="nearby"></div>
 </section>
 <section class="block hidden" id="favBlock">
  <div class="block-head"><h2 id="favTitle">Favourites</h2><span class="hint" id="favHint"></span></div>
  <div class="list" id="favs"></div>
 </section>
 <p class="foot" id="foot">Add this page to your Home Screen to open every dashboard from one icon.</p>
</main>
<script src="shared/weather.js?v=1.1.3" defer></script>
<script src="home.js?v=2.0.1" defer></script>
</body>
</html>
