name: Build MTR station positions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - mtr-eta/make_station_coords.py
      - .github/workflows/mtr-data.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Build station-coords.json from OpenStreetMap
        run: python3 mtr-eta/make_station_coords.py
      - name: Commit station positions
        run: |
          git add -N mtr-eta/station-coords.json
          if git diff --quiet -- mtr-eta/station-coords.json; then echo "Unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtr-eta/station-coords.json
          git commit -m "Build MTR station positions"
          git push
