name: Probe tram and ferry data
on:
  pull_request:
    paths: [tools/probe_tram_ferry.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: python3 tools/probe_tram_ferry.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/raw && git commit -m "Raw tram and ferry data (temporary)" && git push
