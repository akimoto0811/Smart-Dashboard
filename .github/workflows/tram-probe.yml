name: Tram probe
on:
  push:
    branches: [claude/tram-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for c in 104W 02E 39W; do
            echo "=== $c"
            curl -sS -m 30 -i -H "Origin: https://akimoto0811.github.io" "https://tram-proxy.akimoto0811-apple.workers.dev/?stop_code=$c" | head -c 3000; echo
          done
          echo "=== OPTIONS"
          curl -sS -m 30 -i -X OPTIONS -H "Origin: https://akimoto0811.github.io" "https://tram-proxy.akimoto0811-apple.workers.dev/?stop_code=104W"
