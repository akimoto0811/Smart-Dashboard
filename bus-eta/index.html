<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HK Bus ETA"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png">
<title>HK Bus ETA — Dashboard</title>
<link rel="manifest" href="manifest.webmanifest?v=3.5.1"><link rel="stylesheet" href="styles.css?v=3.5.1">
</head>
<body>
<div class="app-shell">
  <header class="topline"><div><div class="eyebrow" id="todayLabel">HONG KONG · TODAY</div><h1 id="pageTitle">Nearby Stops</h1><div class="sub-head" id="pageCaption">Services around your location</div></div><button class="round-button" id="refreshButton" aria-label="Refresh arrivals" title="Refresh">↻</button></header>
  <section id="notice" class="notice hidden" role="status"></section>
  <main id="mainContent"></main>
  <nav class="bottom-nav" aria-label="Dashboard navigation">
    <button data-view="nearby" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Nearby</span></button>
    <button data-view="favourites" class="nav-btn"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.65 6.25.91-4.52 4.4 1.07 6.22L12 17.24l-5.6 2.94 1.07-6.22-4.52-4.4 6.25-.91Z"/></svg><span>Favourites</span></button>
    <button data-view="browse" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Routes</span></button>
    <button data-view="settings" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M18.4 5.6l-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg><span>Settings</span></button>
  </nav>
</div>
<div class="modal-scrim hidden" id="modalScrim" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Route details</h2><button id="closeModal" class="round-button" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<input type="file" accept="application/json,.json" id="catalogueFile" hidden /><input type="file" accept="application/json,.json" id="favouritesFile" hidden />
<script src="app.js?v=3.5.1" defer></script>
</body></html>
